name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Forks don't have the VPS_* secrets configured; without this guard, the job would
    # still run on their `main` pushes and fail red on every commit for no reason.
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      github.repository == 'jaimebg/tuichi-bot'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh "$VPS_USER@$VPS_HOST" "cd ~/tuichi-bot && git pull && npm install --production && sudo systemctl restart tuichi-bot"

          sleep 3
          ssh "$VPS_USER@$VPS_HOST" "curl -sf http://localhost:9090/health && echo ' OK' || echo ' HEALTH CHECK FAILED'"
